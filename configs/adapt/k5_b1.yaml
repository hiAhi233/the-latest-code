defaults:
  - configs/adm_radgenome_b1.yaml

experiment:
  name: k5_b1

checkpoint_root: checkpoints/k5
results_root: results/k5

manifest: caches/manifests/radgenome_brain_mri.jsonl

evidence:
  mode: adm_simple
  localization_dir: caches/adapt/k5/localization
  visual_dir: caches/adapt/k5/visual_b1
  semantic_dir: caches/adapt/k5/unimed

dataset:
  root: /root/autodl-tmp/medadm_k5/MedADM_RRG/data/RadGenome-Brain_MRI/BraTS_GLI

localization:
  backend: external
  detector_root: /root/autodl-tmp/medadm_k5/detector
  checkpoint: localization_adaptation/k5/step600.pt
  source_sequence: t2f
  topk_slices: 3
  heat_size: 64

semantic:
  backend: unimed
  frozen: true
  use_original_image: true
  num_concepts: 13
  prototype_dim: 512
  probability_temperature: 20.0
  unimed_root: /root/autodl-tmp/chestct_k5/MedADM_RRG_ChestCT/vendor/unimed
  weights: /root/autodl-tmp/chestct_k5/MedADM_RRG_ChestCT/vendor/unimed/weights/unimed-clip-vit-b16.pt
  text_encoder: /root/autodl-tmp/chestct_k5/MedADM_RRG_ChestCT/vendor/unimed/weights/biomedbert
  prompts: configs/prompts_brain_mri.json

adm:
  enabled: true

model:
  use_semantic: false
