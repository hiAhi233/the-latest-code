# 报告 Transformer 与训练默认值（方案 §3.5、§6、§7D）。
model:
  evidence_mode: adm_simple
  d_model: 256
  heads: 8
  encoder_layers: 2
  decoder_layers: 4
  ffn: 1024
  dropout: 0.1
  max_report_tokens: 256
  visual_tokens: 108
  semantic_tokens: 13
  num_modalities: 4
  num_views: 2
  z_buckets: 8
  # 2D patch 位置编码的网格大小，必须与视觉缓存的 patch_grid 一致（默认 3）
  patch_grid: 3
  evidence_dropout: 0.1
  use_semantic: true
  use_geometry: false
  use_roi_branch: false

training:
  batch_size: 8
  grad_accum: 2
  epochs: 100
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  label_smoothing: 0.05
  early_stopping_patience: 12
  amp: true
  num_workers: 0
  device: auto
  seed: 0

# 8–16 例过拟合自检（方案 §11 M4）：小数据必须能显著降低训练损失
overfit:
  epochs: 200
  batch_size: 2
  lr: 1.0e-3
  grad_accum: 1
