# B0：原图 → ResNet-101，image-only 基线（无 ADM 增强、无 UniMed 语义）。
defaults:
  - configs/adm_data.yaml
  - configs/adm_model.yaml

experiment:
  name: adm_b0_resnet_original

runtime:
  formal: true
  evidence_mode: adm_simple
  require_zero_shot: true
  forbid_backends: [tiny, tiny_cnn, heuristic, gt_oracle, hash, hash_fallback,
                    prior, probe, random]

evidence:
  mode: adm_simple
  localization_dir: caches/adm/localization/run1
  visual_dir: caches/adm/resnet/run_b0_original
  semantic_dir: caches/adm/unimed/run1

localization:
  backend: external
  detector_root: D:/图神经网络/小样本原型学习/最新定位头版
  checkpoint: D:/图神经网络/小样本原型学习/最新定位头版/runs/mri_foreground_k5_20261029/checkpoint_selected.pt
  source_sequence: t2f
  topk_slices: 3
  heat_size: 64

adm:
  enabled: false
  mode: soft
  gamma: 0.4
  threshold: 0.6
  normal_fallback: original
  oracle_mask: false

visual:
  backbone: resnet101
  pretrained: imagenet
  frozen: true
  patch_grid: 3
  output_dim: 256
  image_size: 224
  modalities: [t1n, t1c, t2w, t2f]
  # 2048→256 投影层的确定性初始化种子；写入缓存身份，改变即缓存失效
  proj_seed: 0

semantic:
  backend: unimed
  frozen: true
  use_original_image: true
  num_concepts: 13
  prototype_dim: 512
  # margin -> probability 的固定温度（不是校准；CLIP logit_scale≈100 会全部饱和）
  probability_temperature: 20.0
  unimed_root: D:/图神经网络/开放词典检测/UniMed-CLIP
  weights: D:/图神经网络/开放词典检测/UniMed-CLIP/weights/unimed-clip-vit-b16.pt
  text_encoder: D:/图神经网络/开放词典检测/UniMed-CLIP/weights/biomedbert
  prompts: configs/prompts_brain_mri.json

model:
  use_semantic: false
