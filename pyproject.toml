[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "medadm-rrg"
version = "1.0.0"
description = "少样本异常检测 + UniMed-CLIP 语义 + ADM 增强 + 报告 Transformer"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "scipy",
  "nibabel",
  "PyYAML",
  "Pillow",
  "transformers",
]

[tool.setuptools]
packages = ["medrrg", "medrrg.data", "medrrg.data.adapters", "medrrg.features",
            "medrrg.model", "medrrg.training", "medrrg.generation",
            "medrrg.evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
